name: API Tests with Demo Database

on:
  push:
    branches: [ main, develop, discovery ]
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Service containers to run with the test job
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nx_test_db
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Make test script executable
      run: chmod +x api/run-tests.sh
      
    - name: Set environment variables for CI
      run: |
        echo "CI=true" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV

    - name: Run API tests with demo database
      working-directory: api
      run: ./run-tests.sh
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nx_test_db
        SPRING_DATASOURCE_USERNAME: test_admin
        SPRING_DATASOURCE_PASSWORD: test_password
        SPRING_PROFILES_ACTIVE: test

    - name: Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports
        path: |
          api/target/surefire-reports/
          api/target/site/
        retention-days: 30

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: api/target/site/jacoco/
        retention-days: 30

    - name: Comment test results on PR
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: API Test Results
        path: api/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

