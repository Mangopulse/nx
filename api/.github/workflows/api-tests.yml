name: API E2E Tests

on:
  push:
    branches: [ main, develop, discovery ]
    paths: [ 'api/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'api/**' ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: root
          POSTGRES_DB: nx_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        java-version: [17, 21]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U admin; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        
    - name: Run unit tests
      run: |
        cd api
        mvn clean test -Dtest="*Test" -B
        
    - name: Run integration tests
      run: |
        cd api
        mvn test -Dtest="*ControllerTest" -B
        
    - name: Run performance tests
      run: |
        cd api
        mvn test -Dtest="LoadTest" -B
      continue-on-error: true
        
    - name: Generate test reports
      run: |
        cd api
        mvn surefire-report:report
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: |
          api/target/surefire-reports/
          api/target/site/
          
    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results (Java ${{ matrix.java-version }})
        path: api/target/surefire-reports/*.xml
        reporter: java-junit
        
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './api/target/surefire-reports';
          
          if (fs.existsSync(path)) {
            const files = fs.readdirSync(path);
            const xmlFiles = files.filter(f => f.endsWith('.xml'));
            
            let totalTests = 0;
            let failedTests = 0;
            
            xmlFiles.forEach(file => {
              const content = fs.readFileSync(`${path}/${file}`, 'utf8');
              const testMatch = content.match(/tests="(\d+)"/);
              const failMatch = content.match(/failures="(\d+)"/);
              const errorMatch = content.match(/errors="(\d+)"/);
              
              if (testMatch) totalTests += parseInt(testMatch[1]);
              if (failMatch) failedTests += parseInt(failMatch[1]);
              if (errorMatch) failedTests += parseInt(errorMatch[1]);
            });
            
            const passedTests = totalTests - failedTests;
            const successRate = totalTests > 0 ? ((passedTests / totalTests) * 100).toFixed(1) : 0;
            
            const comment = `## 🧪 Test Results (Java ${{ matrix.java-version }})
            
            | Metric | Value |
            |--------|-------|
            | Total Tests | ${totalTests} |
            | Passed | ${passedTests} |
            | Failed | ${failedTests} |
            | Success Rate | ${successRate}% |
            
            ${failedTests === 0 ? '✅ All tests passed!' : '❌ Some tests failed. Please check the logs.'}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Run security scan
      run: |
        cd api
        mvn org.owasp:dependency-check-maven:check
      continue-on-error: true
        
    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: api/target/dependency-check-report.html
