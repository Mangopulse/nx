# Test Database Configuration - Demo Database (overrideable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nx_test_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:test_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.expiration=86400000

# Email Configuration (Test)
application.main.sender=test@newsletterx.com

# Logging Configuration
logging.level.root=INFO
logging.level.com.mangox.newsletterx=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.test=DEBUG

# Disable banner for cleaner test output
spring.main.banner-mode=off

